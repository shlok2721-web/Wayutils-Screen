<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
<defs>
  <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#302B78"/>
    <stop offset=".52" stop-color="#17105D"/>
    <stop offset="1" stop-color="#080341"/>
  </linearGradient>
  <linearGradient id="highlight" x1="0" y1="0" x2=".9" y2="1">
    <stop offset="0" stop-color="#A9A4FF" stop-opacity=".72"/>
    <stop offset="1" stop-color="#625BCA" stop-opacity=".08"/>
  </linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#C7C3FF" stop-opacity=".78"/>
    <stop offset="1" stop-color="#6C65D4" stop-opacity=".22"/>
  </linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3.2" result="blur"/>
    <feColorMatrix in="blur" type="matrix"
      values="0 0 0 0 .34  0 0 0 0 .30  0 0 0 0 .92  0 0 0 .28 0" result="tint"/>
    <feMerge><feMergeNode in="tint"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<g filter="url(#glow)">
  <circle cx="64" cy="64" r="48" fill="url(#body)" stroke="url(#edge)" stroke-width="1.7"/>
  <circle cx="64" cy="64" r="39" fill="none" stroke="#A9A4FF" stroke-opacity=".28" stroke-width="1.4"/>
  <circle cx="64" cy="64" r="29" fill="url(#highlight)" opacity=".22"/>
  <path d="M34 45c8-15 24-24 41-22" fill="none" stroke="#D2CFFF" stroke-opacity=".55" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Original pause-symbol concept retained: two vertical pause bars -->
  <rect x="49" y="45" width="10" height="38" rx="3.2" fill="#A9A4FF"/>
  <rect x="69" y="45" width="10" height="38" rx="3.2" fill="#A9A4FF"/>
  <path d="M51 48v30M71 48v30" stroke="#E2DFFF" stroke-opacity=".35" stroke-width="1.4" stroke-linecap="round"/>
</g>
</svg>