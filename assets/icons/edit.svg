<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">

<defs>
  <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#302B78"/>
    <stop offset="0.52" stop-color="#17105D"/>
    <stop offset="1" stop-color="#080341"/>
  </linearGradient>
  <linearGradient id="highlight" x1="0" y1="0" x2="0.9" y2="1">
    <stop offset="0" stop-color="#A9A4FF" stop-opacity=".72"/>
    <stop offset="1" stop-color="#625BCA" stop-opacity=".08"/>
  </linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#C7C3FF" stop-opacity=".78"/>
    <stop offset="1" stop-color="#6C65D4" stop-opacity=".22"/>
  </linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3.2" result="blur"/>
    <feColorMatrix in="blur" type="matrix"
      values="0 0 0 0 0.34  0 0 0 0 0.30  0 0 0 0 0.92  0 0 0 .28 0" result="tint"/>
    <feMerge><feMergeNode in="tint"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<g filter="url(#glow)">
  <!-- Pencil barrel -->
  <path d="M75 23 105 53 46 112 16 116 20 86z" fill="url(#body)" stroke="url(#edge)" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- Metal ferrule band -->
  <path d="M68 30 98 60" stroke="url(#highlight)" stroke-width="12" stroke-linecap="square" opacity=".55"/>
  <!-- Tip -->
  <path d="M20 86 46 112 16 116z" fill="#D2CFFF" opacity=".5"/>
  <path d="M75 23 105 53" stroke="#D2CFFF" stroke-opacity=".6" stroke-width="2" stroke-linecap="round"/>
  <path d="M31 93 22 108" stroke="#A9A4FF" stroke-opacity=".48" stroke-width="1.7" stroke-linecap="round"/>
</g></svg>
